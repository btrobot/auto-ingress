name: Build and Test

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Test configuration
        run: |
          chmod +x bin/test-config
          ./bin/test-config examples/generic.env
          ./bin/test-config examples/multi-site.env

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dns_plugin: [tencentcloud, aliyun, cloudflare, route53]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            DNS_PLUGINS=${{ matrix.dns_plugin }}
            VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REVISION=${{ github.sha }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/auto-ingress:${{ matrix.dns_plugin }}
            ${{ secrets.DOCKERHUB_USERNAME }}/auto-ingress:${{ matrix.dns_plugin }}-${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [test, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            product.json
          generate_release_notes: true
