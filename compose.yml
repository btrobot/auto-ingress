# Auto Ingress v2 - Orchestrator compose
# The gateway container manages a separate Caddy container via Docker API.
name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}

services:
  gateway:
    image: ${GATEWAY_IMAGE:?GATEWAY_IMAGE is required}
    container_name: ${COMPOSE_PROJECT_NAME}-gateway
    restart: unless-stopped

    group_add:
      - "${DOCKER_GID:-988}"

    environment:
      - SELF_IMAGE=${GATEWAY_IMAGE}

    volumes:
      - ./auto-ingress.yaml:/srv/auto-ingress.yaml:ro
      - ./:/srv/auto-ingress
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=1000,gid=1000,mode=0700

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true

    mem_limit: ${MEM_LIMIT:-256m}
    pids_limit: ${PIDS_LIMIT:-256}
    stop_grace_period: 30s

    healthcheck:
      test: ["CMD-SHELL", "docker inspect --format='{{.State.Running}}' auto-ingress-caddy 2>/dev/null | grep -q true"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
