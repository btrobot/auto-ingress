version: 2

project_name: auto-ingress

builds:
  - main: .
    binary: auto-ingress
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/nodecoda/auto-ingress/cmd.version={{.Version}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

brews:
  - repository:
      owner: nodecoda
      name: homebrew-taps
    homepage: https://github.com/nodecoda/auto-ingress
    description: "Automatic HTTPS reverse proxy gateway"
    license: "MIT"

dockers:
  - image_templates:
      - "ghcr.io/nodecoda/auto-ingress:{{ .Version }}"
      - "ghcr.io/nodecoda/auto-ingress:latest"
    dockerfile: Dockerfile.release
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source=https://github.com/nodecoda/auto-ingress"
